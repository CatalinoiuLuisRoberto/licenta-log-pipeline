version: "3.8"

networks:
  monitoring-net:
    driver: bridge

volumes:
  log-data:
  loki-data:
  prometheus-data:
  grafana-data:

services:
  # 1. Mock Server - Produces high-volume server logs & injected anomalies
  mock-app:
    build:
      context: ./mock_app
      dockerfile: Dockerfile
    container_name: mock-app
    restart: unless-stopped
    environment:
      - LOG_FILE_PATH=/var/log/app/server.log
      - DRAIN3_INGEST_URL=http://drain3-service:8000/ingest
      - SEND_TO_DRAIN3_HTTP=true
      - LOGS_PER_SECOND=4.0
    volumes:
      - log-data:/var/log/app
    depends_on:
      - drain3-service
    networks:
      - monitoring-net

  # 2. Drain3 Service - Online Template Miner & Prometheus Metrics Exporter
  drain3-service:
    build:
      context: ./drain3_service
      dockerfile: Dockerfile
    container_name: drain3-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - FORWARD_TO_LOKI=true
    depends_on:
      - loki
    networks:
      - monitoring-net

  # 3. Grafana Loki - Lightweight log aggregation database
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    networks:
      - monitoring-net

  # 4. Promtail - Log shipper shipping container logs to Loki
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yml:ro
      - log-data:/var/log/app:ro
    depends_on:
      - loki
    networks:
      - monitoring-net

  # 5. Prometheus - Time-series metrics engine scraping Drain3 template counts
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - drain3-service
    networks:
      - monitoring-net

  # 6. Grafana - Unified visual dashboard (Port 3000)
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net
